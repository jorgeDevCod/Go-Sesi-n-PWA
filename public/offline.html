<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Go Sesión</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fafaf9;
        color: #27272a;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #18181b;
          color: #e4e4e7;
        }
        button {
          background: #6366f1 !important;
        }
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.95rem;
        opacity: 0.75;
        margin: 0 0 24px;
        line-height: 1.5;
      }
      button {
        border: none;
        border-radius: 9999px;
        padding: 12px 28px;
        font-size: 1rem;
        font-weight: 500;
        color: white;
        background: #6366f1;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Estás sin conexión</h1>
      <p>
        Cuando vuelvas a tener internet, todo seguirá donde lo dejaste.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
