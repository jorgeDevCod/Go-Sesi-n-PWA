services:
  db:
    image: postgres:16-alpine
    container_name: umbral_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: umbral
      POSTGRES_PASSWORD: umbral_dev_password
      POSTGRES_DB: umbral
    ports:
      - "5432:5432"
    volumes:
      - umbral_pgdata:/var/lib/postgresql/data

volumes:
  umbral_pgdata:
